<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribuidora Leo | Bicicletas y Electrodomésticos</title>
    <style>
        /* Estilos Generales */
        :root {
            --rojo-leo: #e33439;
            --oscuro: #1a1a1a;
            --blanco: #ffffff;
            --gris-claro: #f4f4f4;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            line-height: 1.6;
            color: var(--oscuro);
        }

        /* Hero Section (Inspirado en la imagen) */
        .hero {
            display: flex;
            flex-wrap: wrap;
            min-height: 80vh;
            background-color: var(--gris-claro);
        }

        .hero-text {
            flex: 1;
            background-color: var(--rojo-leo);
            color: var(--blanco);
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero-text h1 {
            font-size: 3.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hero-text h2 {
            font-size: 1.2rem;
            font-weight: 300;
            margin-bottom: 20px;
        }

        .hero-text p {
            font-size: 1.1rem;
            margin-top: 30px;
            border-left: 3px solid white;
            padding-left: 15px;
        }

        .hero-image {
            flex: 1;
            background: url('https://images.unsplash.com/photo-1485965120184-e220f721d03e?q=80&w=2070&auto=format&fit=crop') center/cover;
            min-height: 300px;
        }

        /* Sección de Productos */
        .container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-body {
            padding: 20px;
            text-align: center;
        }

        .btn-compra {
            display: inline-block;
            background: var(--rojo-leo);
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }

        /* Footer / Contacto */
        footer {
            background: var(--oscuro);
            color: white;
            padding: 40px 20px;
            text-align: center;
            margin-top: 50px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-text { padding: 30px; }
            .hero-text h1 { font-size: 2.5rem; }
            .hero { flex-direction: column-reverse; }
        }
    </style>
</head>
<body>

    <header class="hero">
        <div class="hero-text">
            <h2>VENTA DE BICICLETAS Y ELECTRODOMÉSTICOS</h2>
            <h1>DISTRIBUIDORA<br>LEO</h1>
            <p>
                <strong>Ubicación:</strong><br>
                Escuela San Agustín<br>
                2c. sur media arriba, Chinandega
            </p>
            <a href="https://www.canva.com/design/DAHMOZj6t84/n4ZVNTFF79bqalu3FKYwEg/view?utm_content=DAHMOZj6t84&utm_campaign=designshare&utm_medium=link&utm_source=viewer" class="btn-compra" style="background: white; color: var(--rojo-leo); font-weight: bold; width: fit-content;">VER CATÁLOGO</a>
        </div>
        <div class="hero-image">
            </div>
    </header>

    <main class="container" id="productos">
        <h2 class="section-title">Nuestros Productos</h2>

        <div class="grid">
            <div class="card">
                <img src="https://images.unsplash.com/photo-112345678" alt="Bicicleta"> <div class="card-body">
                    <h3>Bicicletas Urbanas</h3>
                    <p>Modelos para niños y adultos, variedad de colores.</p>
                    <a href="https://wa.me/+50577210030" class="btn-compra">Consultar Precio</a>
                </div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1584622650111-993a426fbf0a?q=80&w=2070" alt="Electrodoméstico">
                <div class="card-body">
                    <h3>Línea Blanca</h3>
                    <p>Lavadoras, refrigeradoras y cocinas de las mejores marcas.</p>
                    <a href="https://wa.me/+50577210030" class="btn-compra">Consultar Precio</a>
                </div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=1999" alt="Accesorios">
                <div class="card-body">
                    <h3>Pequeños Electrodomésticos</h3>
                    <p>Licuadoras, microondas y más para tu hogar.</p>
                    <a href="https://wa.me/+50577210030" class="btn-compra">Consultar Precio</a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p><strong>Distribuidora Leo - Chinandega</strong></p>
        <p>Visítanos de la Escuela San Agustín 2c. al sur, media arriba.</p>
        <p>&copy; 2026 Todos los derechos reservados.</p>
    </footer>

</body>
